aid: acko
name: Acko
description: >-
  Acko (ACKO Technology & Services Private Limited) is an Indian digital-first
  general insurance company founded in 2016 and headquartered in Bengaluru,
  Karnataka. Acko sells car, bike, health, term life and travel insurance
  entirely online, along with group health and personal-accident cover and
  embedded insurance for partners. It is a portfolio company of Accel. Acko
  exposes insurance policy certificates to citizens through India's government
  API Setu / DigiLocker platform (car, health and two-wheeler certificate
  fetch), and operates a separate enterprise/partner issuance API covering
  token generation, Loan-Shield, Trip, GIG, Health, House, Credit Life, Fire,
  Cyber and Electronics products plus policy and claims management.
